name: Build hacktiv8

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build ${{ matrix.file_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file_name: "hacktiv8_windows"
          - os: ubuntu-latest
            file_name: "hacktiv8_linux"
          - os: macos-latest
            file_name: "hacktiv8_macos_arm64"
          - os: macos-15-intel
            file_name: "hacktiv8_macos_intel"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install DMG Creator (macOS only)
      if: runner.os == 'macOS'
      run: brew install create-dmg

    - name: Build with PyInstaller
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
      run: |
        # Déterminer le séparateur de chemin pour --add-data
        if [ "$RUNNER_OS" == "Windows" ]; then SEP=";"; else SEP=":"; fi

        # Construire la commande pyinstaller de base
        CMD="pyinstaller --noconfirm --onefile --windowed --name \"${{ matrix.file_name }}\" \
          --add-data \"payload.sql${SEP}.\" \
          --add-data \"fond.png${SEP}.\" \
          --add-data \"logo.png${SEP}.\" \
          --hidden-import pymobiledevice3"

        # Ajouter l'icône pour Windows
        if [ "$RUNNER_OS" == "Windows" ]; then
          if [ -f "logo.ico" ]; then
            CMD="$CMD --icon logo.ico"
          fi
        fi

        # Ajouter l'icône pour macOS (si fichier .icns existe)
        if [ "$RUNNER_OS" == "macOS" ]; then
          if [ -f "logo.icns" ]; then
            CMD="$CMD --icon logo.icns"
          fi
        fi

        # Exécuter la commande
        eval $CMD main.py
      shell: bash

    - name: Package macOS DMG
      if: runner.os == 'macOS'
      run: |
        cd dist
        # Copier l'icône dans le bundle si elle existe
        if [ -f "../logo.icns" ]; then
          mkdir -p "${{ matrix.file_name }}.app/Contents/Resources"
          cp ../logo.icns "${{ matrix.file_name }}.app/Contents/Resources/AppIcon.icns"
          plutil -replace CFBundleIconFile -string "AppIcon" "${{ matrix.file_name }}.app/Contents/Info.plist"
        fi

        # Définir la version minimale macOS
        plutil -replace LSMinimumSystemVersion -string "10.13" "${{ matrix.file_name }}.app/Contents/Info.plist"

        # Signer l'application (ad-hoc)
        codesign --force --deep --sign - "${{ matrix.file_name }}.app"

        # Créer le DMG
        create-dmg --volname "hacktiv8" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --text-size 12 \
          --hide-extension "${{ matrix.file_name }}.app" \
          --app-drop-link 450 140 \
          --icon "${{ matrix.file_name }}.app" 150 140 \
          "${{ matrix.file_name }}.dmg" \
          "${{ matrix.file_name }}.app"

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.file_name }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/${{ matrix.file_name }}
